name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos de ejecución a gradlew
      run: chmod +x gradlew

    - name: Ejecutar Tests (Shared Module)
      run: ./gradlew check --no-daemon

    - name: Construir y Verificar proyecto completo
      run: ./gradlew assemble --no-daemon --stacktrace
